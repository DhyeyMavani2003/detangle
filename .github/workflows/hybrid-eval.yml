name: Hybrid eval (LLM lanes)

# Manual holdout evaluation with the LLM and TypeSafe lanes enabled. The
# default CI never spends tokens; this workflow is dispatched on demand and
# needs the ANTHROPIC_API_KEY repository secret for the LLM lanes (the
# `anthropic` backend) and TYPESAFE_API_KEY for the TypeSafe lane. An
# organization-level Anthropic key (one not created inside a workspace) also
# needs ANTHROPIC_WORKSPACE_ID, the console's workspace id, or every call is
# rejected; a workspace-scoped key needs nothing more. Without a secret, that
# lane skips gracefully and the run reports the remaining lanes' numbers, and
# the holdout table's "lane notes" block says which lane skipped and why.
# `lanes: typesafe` reproduces the README's 27/30, 0/19 row in ~20 s.

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "Comma-separated lanes (any of: typesafe,jury,screen)"
        default: "typesafe"
        type: string
      jury_model:
        description: "Jury model (empty = backend default, haiku tier)"
        default: ""
        type: string
      screen_model:
        description: "Screen model (empty = backend default, opus tier)"
        default: ""
        type: string
      cases:
        description: "Comma-separated holdout case ids (empty = all)"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  holdout:
    name: Holdout with lanes ${{ inputs.lanes }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (deterministic + jury)
        run: pip install -e ".[jury]"
      - name: Run holdout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          python -m benchmarks.run_eval --holdout \
            --lanes "${{ inputs.lanes }}" \
            --jury-model "${{ inputs.jury_model }}" \
            --screen-model "${{ inputs.screen_model }}" \
            ${{ inputs.cases != '' && format('--cases "{0}"', inputs.cases) || '' }} \
            --json holdout-results.json | tee holdout.txt
      - name: Summary
        if: always()
        run: |
          echo "## Holdout — lanes: ${{ inputs.lanes }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat holdout.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdout-results
          path: holdout-results.json
