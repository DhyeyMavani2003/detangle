name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ benchmarks/
      - run: ruff format --check src/ tests/ benchmarks/

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  selfscan:
    name: Dogfood (detangle scans its own repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: detangle scan
        run: detangle scan . -v
      - name: SARIF report
        if: always()
        run: detangle scan . --format sarif --output detangle.sarif || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detangle-sarif
          path: detangle.sarif

  benchmark:
    name: Seeded-conflict benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run benchmark
        run: python -m benchmarks.run_eval --json bench-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.json
